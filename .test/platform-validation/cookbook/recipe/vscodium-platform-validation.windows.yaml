name: codium-validation-windows
os: windows
platform: codium

runtime:
  - validation

profile:
  - validation

config:
  dist-strategy:
    extension-marketplace: true
    extension-pool: refresh
    lock-mode: refresh
    default-profile:
      settings: runtime
      extensions: clean
      mcp: unmanaged
  profile-strategy:
    validation:
      settings: profile
